spring.application.name=back-note


# Server Configuration Back-User 8081, Back-Case 8082, Back-Note 8083
server.port=8083

# Back-process Url
process.url=http://localhost:8084

# MongoDB Database Configuration
spring.mongodb.uri=mongodb://globe:password@localhost:27017/medilabo_notes?authSource=admin
spring.data.mongodb.auto-index-creation=true


# Logging Configuration
logging.level.org.springframework.security=INFO
logging.level.org.springframework.security.oauth2=DEBUG
